sonar.organization=al3ksandrs
sonar.projectKey=al3ksandrs_wailsalutem-digital-learning
sonar.sourceEncoding=UTF-8

# Where source code is
sonar.sources=client/src,server/
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/tests/**

# Where tests are
sonar.tests=client/src,server/
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Don't need coverage for these files
sonar.coverage.exclusions=**/common/types.ts,**/common/constants.ts

# Scans both client and server since we use a monorepo
sonar.javascript.lcov.reportPaths=./client/coverage/lcov.info,./server/coverage/lcov.info

# Ignore SQL injection hotspot for student.ts because queries are safe
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=**/server/db/student.ts